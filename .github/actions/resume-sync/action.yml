name: "Resume Sync"
description: >-
  Generate the published Markdown resume from a service-agnostic master data
  file, and sync that same master to job-site profiles. Each service has its
  own adapter that maps the generic definitions to the service's own
  (currently: LAPRAS).
author: "7474"
branding:
  icon: upload-cloud
  color: blue

inputs:
  master_path:
    description: "Path to the master resume data (JSON Resume shaped, with x_ extensions)"
    required: false
    default: "resume.json"
  mode:
    description: >-
      What to run: "check" verifies the generated Markdown matches the master,
      "generate" writes it, "sync" pushes the master to the services,
      "check,sync" does both (default)
    required: false
    default: "check,sync"
  markdown_path:
    description: "Path of the generated Markdown resume (the GitHub Pages page)"
    required: false
    default: "職務経歴.md"
  services:
    description: "Comma-separated services to sync (supported: lapras)"
    required: false
    default: "lapras"
  lapras_api_key:
    description: "LAPRAS API key (https://lapras.com/config/api-key). Required to sync lapras unless dry_run"
    required: false
    default: ""
  delete_missing_experiences:
    description: "If true, delete profile entries on the service that are absent from the master (default: warn only)"
    required: false
    default: "false"
  dry_run:
    description: "If true, print planned writes without calling any service API"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check generated Markdown is up to date
      if: ${{ contains(inputs.mode, 'check') }}
      shell: bash
      env:
        MASTER_PATH: ${{ inputs.master_path }}
        OUTPUT_PATH: ${{ inputs.markdown_path }}
      run: node "$GITHUB_ACTION_PATH/scripts/generate.mjs" --check

    - name: Generate Markdown
      if: ${{ contains(inputs.mode, 'generate') }}
      shell: bash
      env:
        MASTER_PATH: ${{ inputs.master_path }}
        OUTPUT_PATH: ${{ inputs.markdown_path }}
      run: node "$GITHUB_ACTION_PATH/scripts/generate.mjs"

    - name: Sync to job sites
      if: ${{ contains(inputs.mode, 'sync') }}
      shell: bash
      env:
        MASTER_PATH: ${{ inputs.master_path }}
        SERVICES: ${{ inputs.services }}
        DELETE_MISSING: ${{ inputs.delete_missing_experiences }}
        DRY_RUN: ${{ inputs.dry_run }}
        LAPRAS_API_KEY: ${{ inputs.lapras_api_key }}
      run: node "$GITHUB_ACTION_PATH/scripts/sync.mjs"
